name: Build and publish latest

on:
  push:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle build --no-daemon

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          JAR="build/libs/welcome-messages.jar"
          test -f "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Move stable latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest build" \
              --notes "Automatic build from commit ${GITHUB_SHA}." \
              --latest
          else
            gh release create latest \
              --title "Latest build" \
              --notes "Automatic build from commit ${GITHUB_SHA}." \
              --latest
          fi

          gh release upload latest "$JAR" --clobber

      - name: Job summary
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "### Latest JAR" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${REPO}/releases/latest/download/welcome-messages.jar" >> "$GITHUB_STEP_SUMMARY"
